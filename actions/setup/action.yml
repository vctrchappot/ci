name: Set up Node project
description: Node with the package manager's cache and the locked dependencies. Detects pnpm, yarn or npm from the lockfile.

inputs:
  node-version:
    description: Node major version.
    default: "22"

runs:
  using: composite
  steps:
    - id: pm
      shell: bash
      run: |
        if [ -f pnpm-lock.yaml ]; then name=pnpm; install="pnpm install --frozen-lockfile --prefer-offline"
        elif [ -f yarn.lock ]; then name=yarn; install="yarn install --frozen-lockfile"
        else name=npm; install="npm ci --prefer-offline"; fi
        echo "name=$name" >> "$GITHUB_OUTPUT"
        echo "install=$install" >> "$GITHUB_OUTPUT"
    # Without a version, pnpm/action-setup reads the packageManager field of package.json.
    - if: steps.pm.outputs.name == 'pnpm'
      uses: pnpm/action-setup@v6.1.0
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ steps.pm.outputs.name }}
    - shell: bash
      env:
        INSTALL: ${{ steps.pm.outputs.install }}
      run: $INSTALL

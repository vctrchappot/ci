name: CI gate
description: Fails when a suite failed or was cancelled (skipped on purpose is fine) and records which tree passed on a pull request.

inputs:
  results:
    description: toJSON(needs) of the gate job.
    required: true
  tree:
    description: Tree reported by the scope action.
    default: ""
  token:
    description: Token with statuses:write.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        RESULTS: ${{ inputs.results }}
      run: |
        echo "$RESULTS"
        if grep -qE '"result": "(failure|cancelled)"' <<<"$RESULTS"; then exit 1; fi
    # The push to the default branch after the merge recognises this tree and may skip its suites.
    - if: github.event_name == 'pull_request' && inputs.tree != ''
      shell: bash
      continue-on-error: true
      env:
        GH_TOKEN: ${{ inputs.token }}
        TREE: ${{ inputs.tree }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
          -f state=success -f context=ci/verified-tree -f description="tree:$TREE"

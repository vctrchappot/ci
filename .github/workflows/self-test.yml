name: Self test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: npm test
      - run: bash -n scripts/onboard.sh

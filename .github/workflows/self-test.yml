name: Self test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: npm test
      - run: bash -n scripts/onboard.sh
      # The action that runs every suite's commands, on a real runner: each command is timed and listed in the summary.
      - uses: ./actions/run
        with:
          suite: self-test
          commands: |
            node --version
            echo "two commands, two rows in the job summary"
